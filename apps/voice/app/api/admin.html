<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AICTE Voice Assistant - Call reports</title>
<style>
  :root {
    --ink: #1a3a5c; --muted: #5d6b7a; --faint: #8a96a3; --line: #d9e0e7; --bg: #eef2f7; --card: #fff;
    --ok: #1e6e3a; --ok-bg: #e6f4ea; --warn: #8a5a00; --warn-bg: #fff4d6; --bad: #a01c1c; --bad-bg: #fdecea;
    --info: #1a3a5c; --info-bg: #eaf1fb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #9bbbe6; --muted: #aab3bd; --faint: #7d8793; --line: #333d48; --bg: #11161c; --card: #1a212a;
      --ok: #8fd6a4; --ok-bg: #16301f; --warn: #f0c36d; --warn-bg: #3a2f12; --bad: #f1a6a0; --bad-bg: #371a1a;
      --info: #a9c6ec; --info-bg: #17263a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--muted); font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif; }
  header { background: #1a3a5c; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 700; }
  header .sub { font-size: .8rem; opacity: .75; }
  header .spacer { flex: 1; }
  button, .btn { background: #fff; color: #1a3a5c; border: 0; border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: .85rem; cursor: pointer; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { filter: brightness(.95); }
  main { padding: 20px 24px 40px; max-width: 1500px; margin: 0 auto; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--card); border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .stat b { display: block; font-size: 1.6rem; color: var(--ink); line-height: 1.1; }
  .stat span { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
  .bar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  input[type=search] { flex: 1; min-width: 220px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: inherit; font-size: .9rem; }
  .note { font-size: .78rem; color: var(--faint); }
  .tablewrap { background: var(--card); border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .82rem; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--card); color: var(--ink); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; cursor: pointer; user-select: none; }
  tr.row:hover { background: var(--info-bg); cursor: pointer; }
  td.wrap { max-width: 280px; word-break: break-word; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: .72rem; font-weight: 600; white-space: nowrap; }
  .approved, .completed, .complaint_filed { background: var(--ok-bg); color: var(--ok); }
  .not_approved, .in_progress { background: var(--warn-bg); color: var(--warn); }
  .not_found, .hung_up { background: var(--bad-bg); color: var(--bad); }
  .empty { padding: 40px; text-align: center; color: var(--faint); }
  dialog { border: 0; border-radius: 12px; padding: 0; max-width: 820px; width: 92vw; background: var(--card); color: inherit; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .dhead { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .dhead h2 { margin: 0; font-size: 1rem; color: var(--ink); flex: 1; }
  .dbody { padding: 16px 20px; max-height: 72vh; overflow: auto; }
  dl { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; margin: 0 0 16px; }
  dt { color: var(--faint); } dd { margin: 0; word-break: break-word; }
  .line { padding: 6px 10px; border-radius: 8px; margin: 4px 0; }
  .line.Agent { background: var(--info-bg); color: var(--info); }
  .line.Caller { background: var(--ok-bg); color: var(--ok); margin-left: 40px; }
  .line b { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; }
</style>
</head>
<body>
<header>
  <div><h1>AICTE Voice Assistant &mdash; Call reports</h1><div class="sub">Every call: the college asked about, the answer, complaints</div></div>
  <div class="spacer"></div>
  <span class="sub" id="updated"></span>
  <button id="refresh" type="button">Refresh</button>
  <a class="btn" id="export" href="export.csv" download>Export CSV</a>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search college, result, complaint, reference, phone ending&hellip;" aria-label="Search calls">
    <span class="note" id="count"></span>
    <span class="note">Refreshes every 10 seconds. Phone numbers show only the last four digits.</span>
  </div>
  <div class="tablewrap"><table><thead id="head"></thead><tbody id="body"></tbody></table><div class="empty" id="empty" hidden>No calls yet. They appear here as soon as someone calls.</div></div>
</main>
<dialog id="dlg"><div class="dhead"><h2 id="dtitle">Call</h2><button type="button" id="dclose">Close</button></div><div class="dbody" id="dbody"></div></dialog>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const PILL = new Set(["approved", "not_approved", "not_found", "complaint_filed", "completed", "in_progress", "hung_up"]);
  const LABEL = { college_check: "College check", complaint: "Complaint", approved: "Approved", not_approved: "Not approved",
    not_found: "Not found", complaint_filed: "Complaint filed", completed: "Completed", in_progress: "In progress", hung_up: "Hung up" };
  let columns = [], calls = [], sortKey = "started_at", sortDir = -1;

  function cell(key, value) {
    const td = document.createElement("td");
    const text = value == null ? "" : String(value);
    if (["result", "outcome"].includes(key) && text) {
      text.split(" | ").forEach((part, i) => {
        if (i) td.append(" ");
        const s = document.createElement("span");
        s.className = "pill " + (PILL.has(part) ? part : "");
        s.textContent = LABEL[part] || part; td.append(s);
      });
    } else if (key === "intent") { td.textContent = LABEL[text] || text; }
    else if (key === "started_at" || key === "last_activity") { td.textContent = text.replace("T", " ").replace(/\+.*$/, ""); }
    else { td.textContent = text; if (["college_said", "college_matched", "complaint_text", "courses"].includes(key)) td.className = "wrap"; }
    return td;
  }

  function render() {
    const needle = $("q").value.trim().toLowerCase();
    const shown = calls.filter((c) => !needle || Object.values(c).some((v) => String(v ?? "").toLowerCase().includes(needle)));
    shown.sort((a, b) => (String(a[sortKey] ?? "") < String(b[sortKey] ?? "") ? -1 : 1) * sortDir);
    const head = document.createElement("tr");
    columns.forEach((c) => { const th = document.createElement("th"); th.textContent = c.heading + (c.key === sortKey ? (sortDir > 0 ? " ▲" : " ▼") : "");
      th.onclick = () => { sortDir = sortKey === c.key ? -sortDir : 1; sortKey = c.key; render(); }; head.append(th); });
    $("head").replaceChildren(head);
    $("body").replaceChildren(...shown.map((c) => { const tr = document.createElement("tr"); tr.className = "row";
      columns.forEach((col) => tr.append(cell(col.key, c[col.key]))); tr.onclick = () => openCall(c.call_id); return tr; }));
    $("empty").hidden = shown.length > 0;
    $("count").textContent = shown.length + " of " + calls.length + " calls";
  }

  function stats(s) {
    const items = [["Calls", s.calls], ["College checks", s.college_checks], ["Approved", s.approved], ["Not approved", s.not_approved],
      ["Not found", s.not_found], ["Complaints", s.complaints]];
    $("stats").replaceChildren(...items.map(([label, n]) => { const d = document.createElement("div"); d.className = "stat";
      const b = document.createElement("b"); b.textContent = n; const sp = document.createElement("span"); sp.textContent = label; d.append(b, sp); return d; }));
  }

  async function load() {
    try {
      const r = await fetch("api/calls", { cache: "no-store" });
      if (r.status === 401) { location.reload(); return; }
      const data = await r.json();
      columns = data.columns; calls = data.calls; stats(data.summary); render();
      $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
    } catch (e) { $("updated").textContent = "Could not refresh"; }
  }

  async function openCall(id) {
    const r = await fetch("api/calls/" + encodeURIComponent(id), { cache: "no-store" });
    if (!r.ok) return;
    const c = await r.json();
    $("dtitle").textContent = (c.college_said || c.complaint_ref || "Call") + "  ·  " + c.call_id;
    const dl = document.createElement("dl");
    [["Started", c.started_at], ["Duration", c.duration_sec + " s"], ["Direction", c.direction], ["Caller type", c.persona], ["Phone (last 4)", c.phone_masked],
     ["About", LABEL[c.intent] || c.intent], ["College said", c.college_said], ["College matched", c.college_matched], ["Result", c.result],
     ["Approved courses", c.courses], ["Complaint reference", c.complaint_ref], ["Complaint", c.complaint_text], ["Outcome", LABEL[c.outcome] || c.outcome]]
      .forEach(([k, v]) => { if (v) { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = v; dl.append(dt, dd); } });
    const t = document.createElement("div");
    String(c.transcript || "").split(" | ").forEach((l) => { const m = l.match(/^(Agent|Caller): ([\s\S]*)$/); if (!m) return;
      const d = document.createElement("div"); d.className = "line " + m[1]; const b = document.createElement("b"); b.textContent = m[1]; d.append(b, m[2]); t.append(d); });
    $("dbody").replaceChildren(dl, t);
    $("dlg").showModal();
  }

  $("q").addEventListener("input", render);
  $("refresh").addEventListener("click", load);
  $("dclose").addEventListener("click", () => $("dlg").close());
  load(); setInterval(load, 10000);
})();
</script>
</body>
</html>
