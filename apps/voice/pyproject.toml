[project]
name = "acp-voice"
version = "0.1.0"
description = "AICTE Approval & Compliance Portal - AI calling agent (Track V)."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    # -- Web / ASGI ------------------------------------------------------
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.20",   # request.form() on the Twilio webhooks
    # -- Config / validation ---------------------------------------------
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "tzdata>=2024.2",              # zoneinfo has no system tz database on Windows / slim images
    # -- Telephony / auth -------------------------------------------------
    "twilio>=9.3",
    "pyjwt>=2.9",
    # -- LLM (only for CONVERSATION_MODE=relay / hybrid) ------------------
    "openai>=1.50",
    # -- Observability ----------------------------------------------------
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
#  Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "E501",   # line length handled by the formatter
    "S101",   # asserts are fine in tests
    "B008",   # FastAPI Depends() in default args
    "RUF001", "RUF002", "RUF003",  # Indic scripts are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC", "E402", "E731", "B905", "RUF012", "RUF059"]
"scripts/**" = ["S", "E402", "E731", "B905", "SIM117", "S110"]
"mock_core/**" = ["S"]

# ---------------------------------------------------------------------------
#  Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short"]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: fast in-process tests",
    "integration: wires several modules together",
    "slow: > 5s, skipped by default in CI",
]
